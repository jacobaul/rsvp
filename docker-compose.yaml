services:

  app:
    image: docker.abck.ca/rsvp:latest
    restart: unless-stopped
    # Give in-flight requests and after() callbacks time to finish, so a
    # deploy never drops a view that was mid-write to the activity log.
    stop_grace_period: 20s
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      # Existing Postgres server, e.g. postgres://rsvp:pw@db.internal:5432/rsvp
      # The database and role must already exist; the app creates its own
      # tables on first start and needs CREATE on its schema.
      - DATABASE_URL=${DATABASE_URL}
      # require (default) | verify-full | prefer | disable
      - DATABASE_SSL=${DATABASE_SSL:-require}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}

  cloudflared:
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
